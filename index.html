<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Подписка на спонсора Tgrass</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <div class="content">
            <div class="logo-container">
                <div class="logo-glow"></div>
            </div>
            <h1 class="title">
                <span class="title-text">Tgrass</span>
                <span class="title-shine"></span>
            </h1>
            <p class="description">
                Для прохождения спонсора <span class="highlight">Tgrass</span> необходимо подписаться на спонсора
            </p>
            <div class="button-container">
                <button id="subscribe-button" class="subscribe-button">
                    <span class="button-text">Подписаться</span>
                    <span class="button-glow"></span>
                    <span class="button-particles"></span>
                </button>
            </div>
            <div class="decorative-elements">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
