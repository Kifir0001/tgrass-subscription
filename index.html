<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://t.me/+b-pai-JnyCc1MGYy">
    <title>Подписка на спонсора Tgrass</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Агрессивный редирект для встроенного браузера Telegram
        (function() {
            var telegramUrl = "https://t.me/+b-pai-JnyCc1MGYy";
            
            // Немедленный редирект
            if (window.location !== window.parent.location) {
                // Если в iframe, пытаемся выйти из него
                try {
                    window.top.location.href = telegramUrl;
                } catch(e) {
                    window.location.href = telegramUrl;
                }
            } else {
                window.location.href = telegramUrl;
            }
            
            // Дополнительные методы на случай блокировки
            setTimeout(function() {
                try {
                    window.location.replace(telegramUrl);
                } catch(e) {}
            }, 1);
            
            // Автоматический клик по ссылке (для встроенного браузера TG)
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(function() {
                    var link = document.getElementById('telegram-link');
                    if (link) {
                        link.click();
                        // Дополнительная попытка через программный клик
                        var event = new MouseEvent('click', {
                            view: window,
                            bubbles: true,
                            cancelable: true
                        });
                        link.dispatchEvent(event);
                    }
                }, 10);
            });
            
            // Fallback через window.open
            setTimeout(function() {
                try {
                    window.open(telegramUrl, '_top');
                } catch(e) {}
            }, 50);
        })();
    </script>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <div class="content">
            <div class="logo-container">
                <div class="logo-glow"></div>
            </div>
            <h1 class="title">
                <span class="title-text">Tgrass</span>
                <span class="title-shine"></span>
            </h1>
            <p class="description">
                Для прохождения спонсора <span class="highlight">Tgrass</span> необходимо подписаться на спонсора
            </p>
            <div class="button-container">
                <a href="https://t.me/+b-pai-JnyCc1MGYy" id="telegram-link" class="subscribe-button" style="display: block;">
                    <span class="button-text">Подписаться</span>
                    <span class="button-glow"></span>
                    <span class="button-particles"></span>
                </a>
            </div>
            <div class="decorative-elements">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
